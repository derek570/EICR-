name: eviction_redictation_20circuit
suite: bench-08c-a
description: |
  THE required fixture for plan 08C-A (non-optional per the plan). Proves
  the causal claim behind the `snapshotRecentCircuits`/`circuitOrder` arms:
  a narrow recent-circuit WINDOW evicts a circuit's full detail from the
  model-facing snapshot before the inspector is actually done with it,
  while a wider window (or ascending, which never evicts) keeps it visible.

  22-circuit board (large domestic/commercial-style consumer unit; deliberately
  more than SNAPSHOT_RECENT_CIRCUITS=3 and more than the window_6 arm's
  override, so eviction is exercised for BOTH the default and window_6 arm
  before this fixture ends).

  Causality sequence:
    (a) turn 1  — dictate a reading for circuit 1 (Kitchen sockets, Zs).
    (b) turns 2-6 — dictate readings for circuits 2 through 6, IN ORDER.
        After turn 6, session.recentCircuitOrder == [1,2,3,4,5,6] (6 entries):
          - recent_3 (default, window=3): last-3 == [4,5,6] — circuit 1 is
            EVICTED from full detail, folded into the "N earlier circuits
            stored server-side" summary line.
          - window_6 (snapshotRecentCircuits=6): last-6 == [1,2,3,4,5,6] —
            circuit 1 is STILL fully visible.
          - ascending: renders every circuit in numeric order every turn;
            nothing is ever evicted (existing, already-shipped resolver).
    (c) turn 7  — RE-dictate the IDENTICAL circuit-1 value from turn 1,
        VERBATIM. This is the causality trigger: does the model's behaviour
        (round count, whether it treats this as a genuine new write vs.
        recognising the value is unchanged) differ depending on whether
        circuit 1's prior value is visible in the snapshot at this exact
        turn?
    (d) turns 8-23 — continue dictating one reading per circuit for
        circuits 7 through 22 (16 more turns), to reach a realistic full-
        board circuit count so the per-turn token-growth measurement
        (ascending renders EVERY circuit EVERY round, so its snapshot
        keeps growing turn-over-turn in a way recent_3/window_6 do not)
        is exercised across the whole fixture, not just the redictation
        moment. This also eventually evicts circuit 1 from window_6 too
        (once 6 more distinct circuits have been touched after it) — that
        is expected and fine; the causality read this fixture pins is at
        turn 7, before that happens.

  Duplicate-write detection: the production-path-bench.mjs ledger should
  show turn 7's `record_reading` write on (field=measured_zs_ohm,
  circuit=1) as a `duplicate_write_detected: true` turn (turn 1 already
  wrote that exact destination) REGARDLESS of arm — the point is not
  whether the write is flagged as a duplicate (it always will be, since
  duplicate detection reads the ledger, not the model-facing snapshot) but
  whether the ROUND COUNT / token cost for turn 7 differs by arm.

