name: correction_flow
suite: bench-08c-a
description: |
  Correction-path fixture for plan 08C-A: 9 circuits, straightforward
  dictation for the first few, then an explicit spoken correction
  ("actually, circuit 3's Zs is 0.8, not 0.7") exercising the
  last-write-wins overwrite path (see the existing baseline/value_correction.yaml
  scenario for the established convention this mirrors), followed by more
  ordinary dictation. Exercises whether a correction turn's round count /
  token cost differs by circuitOrder/snapshotRecentCircuits arm — a
  correction targets an ALREADY-WRITTEN circuit, so if that circuit has
  been evicted from the recent window the model has to work from the
  "N earlier circuits stored server-side" summary rather than full detail
  when deciding whether/how to overwrite it.

