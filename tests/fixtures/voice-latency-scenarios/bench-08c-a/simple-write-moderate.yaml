name: simple_write_moderate
suite: bench-08c-a
description: |
  Baseline "normal workflow" fixture for plan 08C-A: a moderate-sized
  domestic board (12 circuits), one reading dictated per circuit, straight
  through, no corrections, no ambiguity, no asks. This is the fixture the
  arm comparison should look "boring" on — round counts and per-turn token
  cost should track circuit count roughly linearly for all three arms,
  since nothing here exercises eviction (12 circuits never grows past the
  window_6 arm's override, though it does exceed the recent_3 default
  partway through — that is expected and is itself part of the signal:
  does an ordinary, correction-free session already show a recent_3 vs
  window_6/ascending gap once >3 circuits have been touched?).

