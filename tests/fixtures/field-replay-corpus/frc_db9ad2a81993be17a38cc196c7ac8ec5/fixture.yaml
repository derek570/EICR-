# an Audio-First §2 violation (an ask with no structural gap). Root cause:
# the stored trailing "circuit" token defeats BOTH matcher passes on the
# long entry sentence (pass 1 needs the ENTIRE stored designation inside the
# utterance; pass 2 needs the folded token run [upstairs, light, circuit]
# contiguous — the utterance has [upstairs, light, live, …]). The short
# answer "Upstairs lighting." then matched via pass 1's reverse direction,
# which is why the recovery worked.
#
# WHY unsupported_pending, not expected_red/required_green: the recorded
# lane enters and exits at the runShadowHarness boundary, and the IR-script
# transcript entry runs BEFORE that boundary —
# processInsulationResistanceTurn is invoked from sonnet-stream's
# handleTranscript (pre-model, pre-harness), and on `handled &&
# !fallthrough` the turn NEVER reaches runShadowHarness. The srv-irs- ask,
# the designation lookup (findCircuitsByDesignation), and the LIM
