# mapping in the private archive only — see the executable sibling
# frc_6600a62a…, which locks the id-128 write-side half of the same causal
# chain). Timeline: the circuit had been created ~8 minutes earlier with the
# dirty designation "Upstairs lighting circuit" (id 128). The inspector then
# said "insulation resistance for upstairs lighting live to live is LIM." —
# the dialogue-engine IR script entered with circuit_ref:null,
# entry_designation_matched:false, designation_candidates:[]; LIM was parsed
