# does NOT run the entry designation lookup (it hard-codes
# entry_designation_matched:false), so a fixture faking entry through it
# would exercise a DIFFERENT code path than the defect and prove nothing
# about the matcher. Rather than weaken the boundary or author an
# unfaithful replay, the evidence is frozen here per the corpus's designed
# parking state, and the fixes are covered elsewhere:
