# PLAN-B (feedback id 131, with its id-128 interaction) — IR-script entry
# asked "Which circuit is the insulation resistance for?" despite the circuit
# being NAMED in the utterance. EXECUTABLE via the dialogue_ingress lane.
#
# From the 2026-08-23 field session (feedback ids 128/131; raw session id
# mapping in the private archive only — the executable id-128 write-side
# sibling is frc_6600a62a…). The circuit had been created ~8 minutes earlier
# with the dirty designation "Upstairs lighting circuit" (id 128's pre-fix
# output — seeded here VERBATIM as job_state, exactly the stored state the
# defective turn ran against). The inspector then said "insulation
# resistance for upstairs lighting live to live is LIM." — the
# dialogue-engine IR script entered with circuit_ref:null,
# entry_designation_matched:false, designation_candidates:[]; LIM was parsed
# and QUEUED (not written), and a SERVER-SYNTHESIZED ask (tool_call_id
# `srv-irs-…-which-…`, NO model round) asked "Which circuit is the
# insulation resistance for?" — an Audio-First §2 violation (an ask with no
# structural gap). Root cause: the stored trailing "circuit" token defeats
# BOTH matcher passes on the long entry sentence (pass 1 needs the ENTIRE
# stored designation inside the utterance; pass 2 needs the folded token run
# [upstairs, light, circuit] contiguous — the utterance has [upstairs,
# light, live, …]).
#
# INGRESS-lane semantics (Codex pre-merge, both reviewers): this turn runs
# entirely PRE-harness — processInsulationResistanceTurn is invoked from
# sonnet-stream's handleTranscript before runShadowHarness, and a handled
# turn never reaches the model — so the runner's `dialogue_ingress` lane
# drives that EXACT exported production function (never a reimplementation)
# with this transcript against the seeded session. NO model rounds exist,
# faithfully: the field turn had none.
#
# The fix under lock is BACKEND-deterministic (PLAN-B B3): pass 1 of
# `findCircuitsByDesignation` compares the CANONICAL stored form (edge
# `circuit`/`circuits` tokens dropped via the shared canonicaliser) in both
# directions, so "upstairs lighting" ⊂ the entry sentence resolves ref 2 AT
# ENTRY. Post-fix behaviour, all under ONE joint failure id
# (`script_entry_resolution.op_ir_entry`):
#   - the engine's `_entered` row shows circuit_ref 2 with
#     entry_designation_matched:true (the defect was null + false);
#   - ir_live_live_mohm = LIM is WRITTEN to circuit 2's stored state AND
#     emitted exactly once on the wire (legacy wire name
#     insulation_resistance_l_l);
#   - ZERO which-circuit asks;
#   - exactly ONE audible script ask, and it is the NEXT-slot ask
#     (ir_live_earth_mohm, circuit 2) — the script advanced past the
#     resolved circuit. (The dictated value's spoken read-back is the
#     script FINISH summary by design — PLAN-A2 script-owned coverage —
#     emitted at completion, beyond this single-turn fixture; asserting a
#     mid-walk value confirmation would pin behaviour production does not
#     have.)
#
# Why a single entry turn (not the full 3-turn walk): on PRE-FIX code the
# which-circuit ask derails every subsequent turn ("10." would be consumed
# as a circuit-DIGIT answer, not a reading), so a multi-turn fixture REDs
# with divergent multi-id failures across turns — violating the exact
# expected_failure_id contract. The single entry turn holds the RED to
# exactly one id while locking every leg of the evidenced defect.
#
# RED proof — EXECUTED, not just documented:
# src/__tests__/field-replay/designation-hygiene-red-proof.test.js mocks the
# designation canonicaliser to its pre-PLAN-B semantics (identity — which
# reverts B3's canonical matcher tolerance, the fix under lock) and replays
# THIS fixture through the REAL engine via the same ingress lane — the run
# fails EXACTLY `script_entry_resolution.op_ir_entry` (entry circuit_ref
# null, LIM unwritten, zero wire emission, the which-circuit ask fired, the
# single ask is not the next-slot ask), all clean FAILs. Equivalent
# tree-level procedure: git checkout <pre-PLAN-B base> --
# src/extraction/designation-canonicaliser.js
# src/extraction/dialogue-engine/helpers/circuit-resolution.js, then
# `npm run replay:field-corpus` fails the same single id.
