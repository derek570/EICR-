# PLAN-D 2026-08-23 (feedback id 130) — "one act spoken TWICE": the ask-driven
# create flow (create_circuit{designation} + same-turn record_reading) used to
# emit TWO clips both announcing "circuit 3 = Downstairs light" — the reading
# confirmation carries the designation PREFIX ("Downstairs light, circuit 3,
# wiring type A") AND synthesiseStateChangeConfirmations adds the standalone
# create ack ("Circuit 3 is now the Downstairs light"), because its skip-list
# (skipDesignations) is built ONLY from record_reading(circuit_designation)
# writes, which the create-via-ask flow never produces (the designation travels
# inside create_circuit's input). A perceived exactly-once breach (Audio-First
# invariant #1 — redundant content, inverted ordering).
#
# Field repro (turn-14 of the 2026-08-23 session, reconstructed from CloudWatch
# evidence; raw session id kept out of the repo per corpus PII policy):
# transcript "Wiring time for circuit 3 is a." (Flux mishears "type"→"time");
# the model asks (circuit 3 absent from the schedule); the answer "Downstairs
# light" is enum-REJECTED as a wiring_type value (stage6.ask_user_enum_rejected
# kind:invalid_value — the REAL answer-resolver path this replay exercises);
# the model then calls create_circuit(3, "Downstairs light") +
# record_reading(wiring_type, 3, "A"). Pre-fix: confirmations: 2 (both
# announcing the designation). Post-fix (PLAN-D D3, the bundler create-ack
# MERGE): exactly ONE clip — "Created circuit 3, Downstairs light — wiring
# type A" — and the standalone circop_ ack is dropped (preserved only as a
# non-enumerable mid-stream-filter substitution sidecar, which never crosses
# the wire and is invisible to this oracle).
#
# RECORDED-lane semantics: the frozen model rounds are unchanged by the fix
# (the model's side is identical pre/post — ask, then create+record). The fix
# under lock is BACKEND-deterministic bundler synthesis: which confirmations
# the turn emits for the same tool-call outcomes.
#
# ORACLE: purely expected_audible_outputs (expected_operations stays [] —
# the runtime create_circuit operation oracle is fail-closed INFRASTRUCTURE
# by design, and the reading's presence is implied by the merged confirmation
# text, which the bundler can only synthesise from an actually-projected
# write). One-to-one bipartite matching does the absence work: the ask frame
# and the ONE merged reading confirmation are declared; ANY additional clip —
# the pre-fix standalone create ack, or a designation-prefixed reading — is
# an UNCLAIMED audible output and fails `audibility.unclaimed`.
#
# gate_state is required_green with the fix landing in the SAME branch (the
# corpus state machine's dual-proof admission — an on-disk expected_red would
# fail the merge-blocking gate). red_proof_failure_id documents what REDs on
# pre-fix code: the merged text does not exist there, so
# `audibility.output.out_created_merge` finds 0 matches (and the two legacy
# clips additionally fail unclaimed). The EXECUTED red proof lives in
# src/__tests__/field-replay/create-ack-merge-red-proof.test.js: it replays
# THIS committed fixture's declared oracle against the evidence-reconstructed
# PRE-FIX output set (the exact two texts from the CloudWatch ios_send_attempt
# rows) and asserts the documented id fails.
#
# Provenance: HAND-AUTHORED / reconstructed from CloudWatch evidence rows
# (ios_send_attempt, stage6_tool_call, ask_user_enum_rejected). Unit-test
# twins live in stage6-create-ack-merge.test.js. No captured PII.
