# Plan D (readback-reflects-stored-value, feedback id 100(b) / session C06B9904)
# — "the read-back must speak the value that was STORED".
#
# Field repro (turn 4 of the session): on a TN-C-S installation the inspector
# dictated "Main earth is sixteen now." The model emitted
# record_board_reading{earth_loop_impedance_ze, "16"} and the server SPOKE
# "Ze 16" — while the client independently divided the number by ten and
# stored 1.6. The inspector heard one number and the certificate kept another.
# On a TN-C-S supply a 16 Ω external earth-fault loop impedance is three orders
# of magnitude outside the plausible band, so "16" is a decimal-point garble of
# 1.6 — the CLIENT's arithmetic was right and the SERVER's read-back was wrong.
#
# The fix makes the SERVER authoritative: the value is clamped BEFORE it is
# written, so the snapshot, the wire reading and the spoken confirmation are all
# synthesised from the SAME clamped number, and the correction is NAMED aloud
# ("... — I corrected 16 to 1.6") rather than applied silently. Silent
# divergence between the heard number and the stored number is the
# safety-critical half of this defect; an unannounced correction is the other.
#
# RECORDED-lane semantics: the frozen model round is IDENTICAL pre- and
# post-fix — the model still emits "16"; the fix is entirely in the BACKEND's
# handling of that write (clamp at the dispatcher pre-write seam, carry the
# correction through the bundler into the confirmation text). That is exactly
# the class the recorded lane can lock.
#
# ORACLE: `expected_operations` asserts the WRITE that crosses the wire carries
# the clamped literal 1.6 (the shadow harness folds record_board_reading
# writes into extracted_readings with circuit 0, which is the array the oracle
# reads). `expected_audible_outputs` asserts the SPOKEN line byte-exactly —
# both halves of "stored == spoken" and the named correction. Pre-fix replay
# fails EXACTLY `reading.op_ze_clamped` (the write is "16", never 1.6); the
# audible oracle was added only once the fix landed, per the RED→GREEN
# two-commit contract (an expected_red fixture must fail exactly ONE id).
#
# EARTHING: seeded through `job_state.supply.earthing_arrangement` rather than
# by replaying the real turn-2 that dictated it — replaying that turn would emit
# its own unclaimed "earthing arrangement TN-C-S" confirmation and break the
# exactly-one-failed-id RED requirement. The arrangement is load-bearing here:
# the ze band is TN-C-S/TN-S/TT-dependent and the clamp FAILS SAFE (writes and
# speaks the raw number) when it cannot resolve one.
#
# Provenance: HAND-AUTHORED / reconstructed — the S3 analytics bundle for this
# session is TRUNCATED to cost_summary.json alone (the known iOS multipart
# analytics-upload gap, same constraint as the P3/P4/P5 fixtures), so there is
# no field_sources/manifest. The frozen round is reconstructed from the
# CloudWatch `stage6_tool_call` row for the turn (record_board_reading,
# earth_loop_impedance_ze, confidence 0.95) plus the client realtime log chunks
# (the dictation and the "Ze 16" spoken confirmation). Unit-test twins live in
# stage6-impedance-clamp.test.js. No captured PII.
